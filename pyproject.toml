[project]
name = "rename-file"
version = "0.1.0"
description = "批量文件名修改工具 - 支持正则表达式匹配和多种修改规则"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "wxPython>=4.2.0",
    "pathlib2>=2.3.7; python_version < '3.4'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rename_file"]

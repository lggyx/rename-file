[project]
name = "rename-file"
version = "0.2.0"
description = "批量文件名修改工具 - 支持正则表达式匹配和多种修改规则"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
rename-cli = "rename_file.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rename_file"]

[tool.pytest.ini_options]
testpaths = ["tests"]

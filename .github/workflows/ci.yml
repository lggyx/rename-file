name: CI

on:
  push:
    branches: [main, "refactor/**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: 测试与 lint（Windows）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装测试依赖
        run: python -m pip install pytest ruff
      - name: Ruff 检查
        run: python -m ruff check rename_file tests main.py build.py
      - name: pytest
        run: python -m pytest tests -q

  release:
    name: 打包并发布 exe
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    needs: test
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装 PyInstaller
        run: python -m pip install pyinstaller
      - name: 打包（build.py）
        run: python build.py
      - name: 压缩分发包
        run: Compress-Archive -Path distribution/* -DestinationPath "rename-file-${{ github.ref_name }}.zip"
      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          files: rename-file-*.zip
